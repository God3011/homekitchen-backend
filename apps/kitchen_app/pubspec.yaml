name: kitchen_app
description: Homely Seller App — kitchen daily loop.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.0
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^18.0.0
  geolocator: ^13.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  image_picker: ^1.1.2
  shared:
    path: ../../packages/shared

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

# App icon (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  image_path: "assets/branding/app_icon.png"
  android: true
  ios: false # kitchen (seller) app is Android-only — no iOS project
  min_sdk_android: 21
  adaptive_icon_background: "#3F94A6"
  adaptive_icon_foreground: "assets/branding/adaptive_fg.png"

# Splash screen (run: dart run flutter_native_splash:create)
flutter_native_splash:
  color: "#FBF8F3"
  image: "assets/branding/splash_logo.png"
  android_12:
    color: "#FBF8F3"
    image: "assets/branding/splash_logo.png"
