name: shared
description: Shared Dart package for the Homely food marketplace apps (customer & seller).
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  firebase_auth: ^5.3.0
  firebase_core: ^3.8.0
  firebase_analytics: ^11.4.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^18.0.0
  flutter_riverpod: ^2.6.0
  google_fonts: ^8.2.0
  # AddressPicker (map + GPS + OSM tiles)
  geolocator: ^13.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
